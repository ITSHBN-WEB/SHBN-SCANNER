<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barcode Scanner</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #videoWrap {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #111;
    }
    #guideBox {
      position: absolute;
      border: 2px dashed rgba(255,255,255,0.6);
      border-radius: 8px;
      pointer-events: none;
      top: 38%;
      left: 10%;
      width: 80%;
      height: 24%;
      display: none;
    }
    #tapMarker {
      position: absolute;
      width: 46px;
      height: 46px;
      margin-left: -23px;
      margin-top: -23px;
      border: 3px solid #34d058;
      border-radius: 50%;
      pointer-events: none;
      display: none;
      animation: pulse 0.6s ease-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    .topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: linear-gradient(rgba(0,0,0,0.6), transparent);
    }
    .topbar span { color: white; font-size: 13.5px; font-weight: bold; }
    #cancelBtn {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
    }
    #startCameraBtn {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      padding: 16px 26px;
      font-size: 16px;
      font-weight: bold;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    #status {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 16px 16px 24px;
      text-align: center;
      color: white;
      font-size: 14px;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
      z-index: 10;
      min-height: 20px;
    }
    #confirmBox {
      display: none;
      position: absolute;
      bottom: 90px; left: 16px; right: 16px;
      background: white;
      border-radius: 10px;
      padding: 14px;
      z-index: 12;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
    #confirmBox .label { font-size: 11px; color: #888; text-transform: uppercase; }
    #confirmBox .value { font-size: 20px; font-weight: bold; color: #1a1a1a; margin: 4px 0 12px; }
    #confirmBox .row { display: flex; gap: 8px; }
    #confirmBox button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; }
    #confirmYes { background: #1a73e8; color: white; }
    #confirmNo { background: #eee; color: #333; }
    #manualRow {
      display: none;
      position: absolute;
      bottom: 60px; left: 16px; right: 16px;
      z-index: 11;
      gap: 8px;
    }
    #manualRow input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
    }
    #manualRow button {
      padding: 10px 14px;
      border-radius: 6px;
      border: none;
      background: #1a73e8;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="videoWrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="guideBox"></div>
    <div id="tapMarker"></div>
  </div>

  <button id="startCameraBtn">Tap to Start Camera</button>

  <div class="topbar">
    <span>Tap directly on the barcode</span>
    <button id="cancelBtn">Cancel</button>
  </div>

  <div id="confirmBox">
    <div class="label">Detected number</div>
    <div class="value" id="confirmValue">-</div>
    <div class="row">
      <button id="confirmYes">Use this</button>
      <button id="confirmNo">Try again</button>
    </div>
  </div>

  <div id="manualRow">
    <input type="text" id="manualInput" placeholder="Type code manually">
    <button id="manualBtn">Use</button>
  </div>

  <div id="status">Tap "Start Camera" to begin</div>

  <!-- Not attached to DOM visibly - html5-qrcode needs a target element id -->
  <div id="reader" style="display:none;"></div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
  <script>
    var video = document.getElementById('video');
    var statusEl = document.getElementById('status');
    var guideBox = document.getElementById('guideBox');
    var tapMarker = document.getElementById('tapMarker');
    var confirmBox = document.getElementById('confirmBox');
    var confirmValue = document.getElementById('confirmValue');
    var manualRow = document.getElementById('manualRow');
    var startBtn = document.getElementById('startCameraBtn');

    var stream = null;
    var track = null;
    var zxingReader = new ZXing.BrowserMultiFormatReader();
    var sent = false;
    var busy = false; // prevents overlapping tap attempts
    var tesseractLoadPromise = null;
    var cameraTimeoutId = null;

    // ---------- Pre-flight checks (run immediately, before any tap) ----------
    function preflightCheck() {
      // Secure context check - getUserMedia silently fails/hangs on some
      // browsers if the page isn't served over HTTPS (or localhost).
      if (!window.isSecureContext) {
        statusEl.textContent = 'This page must be loaded over HTTPS for camera access to work.';
        startBtn.style.display = 'none';
        manualRow.style.display = 'flex';
        return false;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusEl.textContent = 'This browser does not support camera access. Try Chrome, or type the code below.';
        startBtn.style.display = 'none';
        manualRow.style.display = 'flex';
        return false;
      }
      return true;
    }
    var preflightOk = preflightCheck();

    // ---------- Camera start (tied to a real tap - required by some browsers) ----------
    startBtn.addEventListener('click', startCamera);
