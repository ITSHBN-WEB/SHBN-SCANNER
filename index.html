<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barcode Scanner</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #videoWrap {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #guideBox {
      position: absolute;
      border: 2px dashed rgba(255,255,255,0.6);
      border-radius: 8px;
      pointer-events: none;
      top: 38%;
      left: 10%;
      width: 80%;
      height: 24%;
    }
    #tapMarker {
      position: absolute;
      width: 46px;
      height: 46px;
      margin-left: -23px;
      margin-top: -23px;
      border: 3px solid #34d058;
      border-radius: 50%;
      pointer-events: none;
      display: none;
      animation: pulse 0.6s ease-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    .topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: linear-gradient(rgba(0,0,0,0.6), transparent);
    }
    .topbar span { color: white; font-size: 13.5px; font-weight: bold; }
    #cancelBtn {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
    }
    #status {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 16px 16px 24px;
      text-align: center;
      color: white;
      font-size: 14px;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
      z-index: 10;
      min-height: 20px;
    }
    #confirmBox {
      display: none;
      position: absolute;
      bottom: 90px; left: 16px; right: 16px;
      background: white;
      border-radius: 10px;
      padding: 14px;
      z-index: 12;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
    #confirmBox .label { font-size: 11px; color: #888; text-transform: uppercase; }
    #confirmBox .value { font-size: 20px; font-weight: bold; color: #1a1a1a; margin: 4px 0 12px; }
    #confirmBox .row { display: flex; gap: 8px; }
    #confirmBox button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; }
    #confirmYes { background: #1a73e8; color: white; }
    #confirmNo { background: #eee; color: #333; }
    #manualRow {
      display: none;
      position: absolute;
      bottom: 60px; left: 16px; right: 16px;
      z-index: 11;
      gap: 8px;
    }
    #manualRow input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
    }
    #manualRow button {
      padding: 10px 14px;
      border-radius: 6px;
      border: none;
      background: #1a73e8;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="videoWrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="guideBox"></div>
    <div id="tapMarker"></div>
  </div>

  <div class="topbar">
    <span>Tap directly on the barcode</span>
    <button id="cancelBtn">Cancel</button>
  </div>

  <div id="confirmBox">
    <div class="label">Detected number</div>
    <div class="value" id="confirmValue">-</div>
    <div class="row">
      <button id="confirmYes">Use this</button>
      <button id="confirmNo">Try again</button>
    </div>
  </div>

  <div id="manualRow">
    <input type="text" id="manualInput" placeholder="Type code manually">
    <button id="manualBtn">Use</button>
  </div>

  <div id="status">Starting camera...</div>

  <!-- Not attached to DOM visibly - html5-qrcode needs a target element id -->
  <div id="reader" style="display:none;"></div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    var video = document.getElementById('video');
    var statusEl = document.getElementById('status');
    var guideBox = document.getElementById('guideBox');
    var tapMarker = document.getElementById('tapMarker');
    var confirmBox = document.getElementById('confirmBox');
    var confirmValue = document.getElementById('confirmValue');
    var manualRow = document.getElementById('manualRow');

    var stream = null;
    var track = null;
    var html5QrCode = new Html5Qrcode('reader');
    var sent = false;
    var busy = false; // prevents overlapping tap attempts
    var tesseractLoadPromise = null;

    // ---------- Camera setup ----------
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment',
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    }).then(function (s) {
      stream = s;
      track = stream.getVideoTracks()[0];
      video.srcObject = stream;
      statusEl.textContent = 'Tap directly on the barcode';
    }).catch(function (err) {
      statusEl.textContent = 'Camera unavailable. Type the code below instead.';
      manualRow.style.display = 'flex';
    });

    // ---------- Tap-to-scan ----------
    video.addEventListener('click', onTap);
    video.addEventListener('touchend', function (e) {
      e.preventDefault();
      var t = e.changedTouches[0];
      handleTapAt(t.clientX, t.clientY);
    });

    function onTap(e) {
      handleTapAt(e.clientX, e.clientY);
    }

    function handleTapAt(clientX, clientY) {
      if (busy || sent || !video.videoWidth) return;
      busy = true;

      var rect = video.getBoundingClientRect();
      var tapX = clientX - rect.left;
      var tapY = clientY - rect.top;

      tapMarker.style.left = tapX + 'px';
      tapMarker.style.top = tapY + 'px';
      tapMarker.style.display = 'block';
      // restart the pulse animation
      tapMarker.style.animation = 'none';
      void tapMarker.offsetWidth;
      tapMarker.style.animation = 'pulse 0.6s ease-out';

      // Convert tapped client coords -> actual video pixel coords,
      // accounting for object-fit: cover cropping/scaling.
      var scale = Math.max(rect.width / video.videoWidth, rect.height / video.videoHeight);
      var displayedW = video.videoWidth * scale;
      var displayedH = video.videoHeight * scale;
      var offsetX = (displayedW - rect.width) / 2;
      var offsetY = (displayedH - rect.height) / 2;
      var videoX = (tapX + offsetX) / scale;
      var videoY = (tapY + offsetY) / scale;

      // Best-effort tap-to-focus. Support varies by device; ignored if unavailable.
      tryFocusAt(videoX / video.videoWidth, videoY / video.videoHeight);

      // Crop box centered on tap: wide box to fit a barcode + its printed digits.
      var cropW = Math.min(video.videoWidth * 0.55, video.videoWidth);
      var cropH = Math.min(video.videoHeight * 0.30, video.videoHeight);
      var cropX = clamp(videoX - cropW / 2, 0, video.videoWidth - cropW);
      var cropY = clamp(videoY - cropH / 2, 0, video.videoHeight - cropH);

      statusEl.textContent = 'Reading...';
      attemptDecode({ x: cropX, y: cropY, w: cropW, h: cropH }, 0);
    }

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    function tryFocusAt(nx, ny) {
      if (!track || !track.getCapabilities) return;
      try {
        var caps = track.getCapabilities();
        if (caps.pointsOfInterest) {
          track.applyConstraints({ advanced: [{ pointsOfInterest: [{ x: nx, y: ny }] }] }).catch(function () {});
        } else if (caps.focusMode && caps.focusMode.indexOf('continuous') !== -1) {
          track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
        }
      } catch (e) { /* ignore - best effort only */ }
    }

    // ---------- Crop capture ----------
    function captureCrop(box) {
      var canvas = document.createElement('canvas');
      canvas.width = box.w;
      canvas.height = box.h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(video, box.x, box.y, box.w, box.h, 0, 0, box.w, box.h);
      return canvas;
    }

    function canvasToBlob(canvas) {
      return new Promise(function (resolve) {
        canvas.toBlob(function (blob) { resolve(blob); }, 'image/jpeg', 0.95);
      });
    }

    // ---------- Barcode decode attempts, then OCR fallback ----------
    var MAX_BARCODE_ATTEMPTS = 3;

    function attemptDecode(box, attemptNum) {
      var canvas = captureCrop(box);
      canvasToBlob(canvas).then(function (blob) {
        html5QrCode.scanFile(blob, false)
          .then(function (decodedText) {
            finishSuccess(decodedText.trim());
          })
          .catch(function () {
            if (attemptNum + 1 < MAX_BARCODE_ATTEMPTS) {
              setTimeout(function () { attemptDecode(box, attemptNum + 1); }, 350);
            } else {
              // Barcode decode failed after a few tries - fall back to OCR
              // on the printed digits beneath the barcode.
              statusEl.textContent = 'Trying text recognition...';
              runOcrFallback(box);
            }
          });
      });
    }

    function runOcrFallback(box) {
      loadTesseract().then(function () {
        // Bias the crop toward the lower portion, where the printed
        // digit string normally sits directly under the bars.
        var textBox = {
          x: box.x,
          y: box.y + box.h * 0.55,
          w: box.w,
          h: box.h * 0.45
        };
        var canvas = captureCrop(textBox);

        Tesseract.recognize(canvas, 'eng', {
          tessedit_char_whitelist: '0123456789'
        }).then(function
