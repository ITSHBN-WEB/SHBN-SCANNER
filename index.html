<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barcode Scanner</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #videoWrap {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #111;
    }
    #guideBox {
      position: absolute;
      border: 2px dashed rgba(255,255,255,0.6);
      border-radius: 8px;
      pointer-events: none;
      top: 38%;
      left: 10%;
      width: 80%;
      height: 24%;
      display: none;
    }
    #tapMarker {
      position: absolute;
      width: 46px;
      height: 46px;
      margin-left: -23px;
      margin-top: -23px;
      border: 3px solid #34d058;
      border-radius: 50%;
      pointer-events: none;
      display: none;
      animation: pulse 0.6s ease-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    .topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: linear-gradient(rgba(0,0,0,0.6), transparent);
    }
    .topbar span { color: white; font-size: 13.5px; font-weight: bold; }
    #cancelBtn {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
    }
    #startCameraBtn {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      padding: 16px 26px;
      font-size: 16px;
      font-weight: bold;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    #status {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 16px 16px 24px;
      text-align: center;
      color: white;
      font-size: 14px;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
      z-index: 10;
      min-height: 20px;
    }
    #confirmBox {
      display: none;
      position: absolute;
      bottom: 90px; left: 16px; right: 16px;
      background: white;
      border-radius: 10px;
      padding: 14px;
      z-index: 12;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
    #confirmBox .label { font-size: 11px; color: #888; text-transform: uppercase; }
    #confirmBox .value { font-size: 20px; font-weight: bold; color: #1a1a1a; margin: 4px 0 12px; }
    #confirmBox .row { display: flex; gap: 8px; }
    #confirmBox button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; }
    #confirmYes { background: #1a73e8; color: white; }
    #confirmNo { background: #eee; color: #333; }
    #manualRow {
      display: none;
      position: absolute;
      bottom: 60px; left: 16px; right: 16px;
      z-index: 11;
      gap: 8px;
    }
    #manualRow input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
    }
    #manualRow button {
      padding: 10px 14px;
      border-radius: 6px;
      border: none;
      background: #1a73e8;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="videoWrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="guideBox"></div>
    <div id="tapMarker"></div>
  </div>

  <button id="startCameraBtn">Tap to Start Camera</button>

  <div class="topbar">
    <span>Tap directly on the barcode</span>
    <button id="cancelBtn">Cancel</button>
  </div>

  <div id="confirmBox">
    <div class="label">Detected number</div>
    <div class="value" id="confirmValue">-</div>
    <div class="row">
      <button id="confirmYes">Use this</button>
      <button id="confirmNo">Try again</button>
    </div>
  </div>

  <div id="manualRow">
    <input type="text" id="manualInput" placeholder="Type code manually">
    <button id="manualBtn">Use</button>
  </div>

  <div id="status">Tap "Start Camera" to begin</div>

  <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
  <script src="https://unpkg.com/@zxing/browser@latest"></script>
  <script>
    var video = document.getElementById('video');
    var statusEl = document.getElementById('status');
    var guideBox = document.getElementById('guideBox');
    var tapMarker = document.getElementById('tapMarker');
    var confirmBox = document.getElementById('confirmBox');
    var confirmValue = document.getElementById('confirmValue');
    var manualRow = document.getElementById('manualRow');
    var startBtn = document.getElementById('startCameraBtn');

    var stream = null;
    var track = null;
    // Correct package: @zxing/browser (window.ZXingBrowser), not @zxing/library.
    // @zxing/library alone does not expose decodeFromCanvas.
    var zxingReader = new ZXingBrowser.BrowserMultiFormatReader();
    var sent = false;
    var busy = false; // prevents overlapping tap attempts
    var tesseractLoadPromise = null;
    var cameraTimeoutId = null;

    // ---------- Pre-flight checks (run immediately, before any tap) ----------
    function preflightCheck() {
      if (!window.isSecureContext) {
        statusEl.textContent = 'This page must be loaded over HTTPS for camera access to work.';
        startBtn.style.display = 'none';
        manualRow.style.display = 'flex';
        return false;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusEl.textContent = 'This browser does not support camera access. Try Chrome, or type the code below.';
        startBtn.style.display = 'none';
        manualRow.style.display = 'flex';
        return false;
      }
      return true;
    }
    var preflightOk = preflightCheck();

    // ---------- Camera start (tied to a real tap - required by some browsers) ----------
    startBtn.addEventListener('click', startCamera);

    function startCamera() {
      if (!preflightOk) return;
      startBtn.style.display = 'none';
      statusEl.textContent = 'Requesting camera access...';

      cameraTimeoutId = setTimeout(function () {
        statusEl.textContent = 'Camera is taking too long to respond on this browser. Try Chrome/Safari, or type the code below.';
        manualRow.style.display = 'flex';
        startBtn.style.display = 'block';
        startBtn.textContent = 'Try Again';
      }, 8000);

      navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'environment',
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      }).then(function (s) {
        clearTimeout(cameraTimeoutId);
        stream = s;
        track = stream.getVideoTracks()[0];
        video.srcObject = stream;
        guideBox.style.display = 'block';
        statusEl.textContent = 'Tap directly on the barcode';
      }).catch(function (err) {
        clearTimeout(cameraTimeoutId);
        var reason = (err && err.name) ? err.name : 'unknown error';
        var friendly = 'Camera error (' + reason + ').';
        if (reason === 'NotAllowedError') {
          friendly = 'Camera permission was denied. Check the site permissions (tap the icon next to the address bar) and allow camera access.';
        } else if (reason === 'NotFoundError') {
          friendly = 'No camera was found on this device.';
        } else if (reason === 'NotReadableError') {
          friendly = 'Camera is already in use by another app. Close other camera apps and try again.';
        }
        statusEl.textContent = friendly + ' You can type the code below instead.';
        manualRow.style.display = 'flex';
        startBtn.style.display = 'block';
        startBtn.textContent = 'Try Again';
      });
    }

    // ---------- Tap-to-scan ----------
    video.addEventListener('click', onTap);
    video.addEventListener('touchend', function (e) {
      e.preventDefault();
      var t = e.changedTouches[0];
      handleTapAt(t.clientX, t.clientY);
    });

    function onTap(e) {
      handleTapAt(e.clientX, e.clientY);
    }

    function handleTapAt(clientX, clientY) {
      if (busy || sent || !stream || !video.videoWidth) return;
      busy = true;

      var rect = video.getBoundingClientRect();
      var tapX = clientX - rect.left;
      var tapY = clientY - rect.top;

      tapMarker.style.left = tapX + 'px';
      tapMarker.style.top = tapY + 'px';
      tapMarker.style.display = 'block';
      tapMarker.style.animation = 'none';
      void tapMarker.offsetWidth;
      tapMarker.style.animation = 'pulse 0.6s ease-out';

      var scale = Math.max(rect.width / video.videoWidth, rect.height / video.videoHeight);
      var displayedW = video.videoWidth * scale;
      var displayedH = video.videoHeight * scale;
      var offsetX = (displayedW - rect.width) / 2;
      var offsetY = (displayedH - rect.height) / 2;
      var videoX = (tapX + offsetX) / scale;
      var videoY = (tapY + offsetY) / scale;

      tryFocusAt(videoX / video.videoWidth, videoY / video.videoHeight);

      var cropW = Math.min(video.videoWidth * 0.55, video.videoWidth);
      var cropH = Math.min(video.videoHeight * 0.30, video.videoHeight);
      var cropX = clamp(videoX - cropW / 2, 0, video.videoWidth - cropW);
      var cropY = clamp(videoY - cropH / 2, 0, video.videoHeight - cropH);

      statusEl.textContent = 'Reading...';
      attemptDecode({ x: cropX, y: cropY, w: cropW, h: cropH }, 0);
    }

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    function tryFocusAt(nx, ny) {
      if (!track || !track.getCapabilities) return;
      try {
        var caps = track.getCapabilities();
        if (caps.pointsOfInterest) {
          track.applyConstraints({ advanced: [{ pointsOfInterest: [{ x: nx, y: ny }] }] }).catch(function () {});
        } else if (caps.focusMode && caps.focusMode.indexOf('continuous') !== -1) {
          track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
        }
      } catch (e) { /* ignore - best effort only */ }
    }

    // ---------- Crop capture ----------
    function captureCrop(box) {
      var canvas = document.createElement('canvas');
      canvas.width = box.w;
      canvas.height = box.h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(video, box.x, box.y, box.w, box.h, 0, 0, box.w, box.h);
      return canvas;
    }

    // ---------- Barcode decode: native detector -> ZXing (canvas, async) -> OCR fallback ----------
    var MAX_BARCODE_ATTEMPTS = 2;
    var ATTEMPT_DELAY = 120; // just enough for autofocus to catch up

    function attemptDecode(box, attemptNum) {
      var canvas = captureCrop(box);

      // Fast path: native ML-based detector (Android Chrome).
      tryNativeDetector(canvas)
        .then(finishSuccess)
        .catch(function () {
          // Fallback: ZXing via @zxing/browser, decoding directly from
          // the canvas. decodeFromCanvas returns a Promise - must be
          // chained with .then/.catch, not wrapped in try/catch.
          zxingReader.decodeFromCanvas(canvas)
            .then(function (result) {
              finishSuccess(result.getText());
            })
            .catch(function () {
              if (attemptNum + 1 < MAX_BARCODE_ATTEMPTS) {
                setTimeout(function () { attemptDecode(box, attemptNum + 1); }, ATTEMPT_DELAY);
              } else {
                statusEl.textContent = 'Trying text recognition...';
                runOcrFallback(box);
              }
            });
        });
    }

    function tryNativeDetector(canvas) {
      if (!('BarcodeDetector' in window)) return Promise.reject('unsupported');
      var detector = new BarcodeDetector({
        formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'qr_code']
      });
      return detector.detect(canvas).then(function (codes) {
        if (codes && codes.length > 0) return codes[0].rawValue;
        throw new Error('no barcode found');
      });
    }

    function runOcrFallback(box) {
      loadTesseract().then(function () {
        var textBox = {
          x: box.x,
          y: box.y + box.h * 0.55,
          w: box.w,
          h: box.h * 0.45
        };
        var canvas = captureCrop(textBox);

        Tesseract.recognize(canvas, 'eng', {
          tessedit_char_whitelist: '0123456789'
        }).then(function (result) {
          var raw = (result && result.data && result.data.text) || '';
          var candidate = extractValidCode(raw);
          if (candidate) {
            offerConfirmation(candidate);
          } else {
            giveUpThisTap();
          }
        }).catch(function () {
          giveUpThisTap();
        });
      }).catch(function () {
        giveUpThisTap();
      });
    }

    function loadTesseract() {
      if (typeof Tesseract !== 'undefined') return Promise.resolve();
      if (tesseractLoadPromise) return tesseractLoadPromise;
      tesseractLoadPromise = new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = 'https://unpkg.com/tesseract.js@5/dist/tesseract.min.js';
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
      return tesseractLoadPromise;
    }

    function giveUpThisTap() {
      busy = false;
      statusEl.textContent = 'Could not read that spot - try tapping again';
    }

    // ---------- Digit validation (EAN-13 / UPC-A / EAN-8 check digit) ----------
    function isValidEAN13(code) {
      if (!/^\d{13}$/.test(code)) return false;
      var sum = 0;
      for (var i = 0; i < 12; i++) sum += Number(code[i]) * (i % 2 === 0 ? 1 : 3);
      return ((10 - (sum % 10)) % 10) === Number(code[12]);
    }
    function isValidUPCA(code) {
      if (!/^\d{12}$/.test(code)) return false;
      var sum = 0;
      for (var i = 0; i < 11; i++) sum += Number(code[i]) * (i % 2 === 0 ? 3 : 1);
      return ((10 - (sum % 10)) % 10) === Number(code[11]);
    }
    function isValidEAN8(code) {
      if (!/^\d{8}$/.test(code)) return false;
      var sum = 0;
      for (var i = 0; i < 7; i++) sum += Number(code[i]) * (i % 2 === 0 ? 3 : 1);
      return ((10 - (sum % 10)) % 10) === Number(code[7]);
    }

    function extractValidCode(rawText) {
      var digitRuns = rawText.match(/\d{8,13}/g) || [];
      for (var i = 0; i < digitRuns.length; i++) {
        var run = digitRuns[i];
        var lens = [13, 12, 8];
        for (var j = 0; j < lens.length; j++) {
          var len = lens[j];
          if (run.length < len) continue;
          for (var start = 0; start + len <= run.length; start++) {
            var candidate = run.substr(start, len);
            if (len === 13 && isValidEAN13(candidate)) return candidate;
            if (len === 12 && isValidUPCA(candidate)) return candidate;
            if (len === 8 && isValidEAN8(candidate)) return candidate;
          }
        }
      }
      return null;
    }

    // ---------- Confirmation UI for OCR results ----------
    function offerConfirmation(code) {
      busy = false;
      statusEl.textContent = '';
      confirmValue.textContent = code;
      confirmBox.style.display = 'block';

      document.getElementById('confirmYes').onclick = function () {
        confirmBox.style.display = 'none';
        finishSuccess(code);
      };
      document.getElementById('confirmNo').onclick = function () {
        confirmBox.style.display = 'none';
        statusEl.textContent = 'Tap directly on the barcode';
      };
    }

    // ---------- Send result back to opener ----------
    function finishSuccess(code) {
      if (sent) return;
      sent = true;
      if (window.opener) {
        window.opener.postMessage({ type: 'barcode-result', code: code }, '*');
      }
      stopAndClose();
    }

    function stopAndClose() {
      if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
      window.close();
      statusEl.textContent = 'Done. You can close this tab and return to the app.';
    }

    document.getElementById('cancelBtn').addEventListener('click', function () {
      if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
      window.close();
    });

    document.getElementById('manualBtn').addEventListener('click', function () {
      var val = document.getElementById('manualInput').value.trim();
      if (val) finishSuccess(val);
    });
  </script>
</body>
</html>
